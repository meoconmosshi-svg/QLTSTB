build.generated.sources.dir=${build.dir}/generated-sources
debug.modulepath=\
    ${run.modulepath}
debug.test.modulepath=\
    ${run.test.modulepath}
excludes=
javac.modulepath=
javac.processormodulepath=
javac.test.modulepath=\
    ${javac.modulepath}
run.modulepath=\
    ${javac.modulepath}
run.test.modulepath=\
    ${javac.test.modulepath}
# ---------------------------------------------------------------------
# Source roots
# ---------------------------------------------------------------------
src.dir=src
src.root=src
includes=**

# ---------------------------------------------------------------------
# Compile settings
# ---------------------------------------------------------------------
javac.source=17
javac.target=17
javac.compilerargs=-Xlint:all,-serial
javac.includes=
empty.classpath=

build.dir=build
build.classes.dir=build/classes
build.classes.excludes=
build.test.classes.dir=build/test/classes
build.test.results.dir=build/test/results

# ---------------------------------------------------------------------
# Distribution / packaging
# ---------------------------------------------------------------------
dist.dir=dist
dist.javadoc.dir=dist/javadoc
dist.jar=dist/QLTSTB-1.0.jar
main.class=com.company.qlts.Main
run.class=
debug.class=
debug.jvmargs=
fix.includes=

# ---------------------------------------------------------------------
# Libraries - SQL Server JDBC driver
# Registered so it shows up in Project Properties > Libraries.
# The actual javac.classpath / run.classpath values are defined in the
# root build.xml using <property refid=...> - do not set them here,
# a bare "file.reference.*" token is not a valid path.
# ---------------------------------------------------------------------
file.reference.mssql-jdbc=lib/mssql-jdbc-13.4.0.jre11.jar
libraries.mssql-jdbc.classpath=file.reference.mssql-jdbc
